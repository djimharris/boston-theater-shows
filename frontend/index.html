<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Theater Shows</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <h1>Boston Theater Shows</h1>
            <nav class="view-toggle">
                <button data-view="card" class="active" aria-pressed="true">Card View</button>
                <button data-view="calendar" aria-pressed="false">Calendar View</button>
            </nav>
        </div>
    </header>

    <section class="filters" aria-label="Show filters">
        <div class="filters-content">
            <div class="date-filter">
                <label for="filter-start">From:</label>
                <input type="date" id="filter-start">
                <label for="filter-end">To:</label>
                <input type="date" id="filter-end">
            </div>
            <div class="theater-filter">
                <label>Theaters:</label>
                <div class="dropdown" id="theater-dropdown">
                    <button type="button" class="dropdown-toggle" id="theater-dropdown-btn" aria-expanded="false">
                        All theaters
                    </button>
                    <div class="dropdown-menu" id="theater-dropdown-menu" hidden>
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
            <button id="filter-reset" class="btn-reset">Reset Filters</button>
        </div>
    </section>

    <main id="content" aria-live="polite">
        <div class="loading">Loading shows...</div>
    </main>

    <section class="deferred-sites" aria-label="Additional venues">
        <h3>Additional Venues (Visit Directly)</h3>
        <p class="deferred-note">These sites require JavaScript rendering and cannot be scraped automatically yet.</p>
        <div class="deferred-links">
            <a href="https://www.citizensoperahouse.com/events/" target="_blank" rel="noopener">
                Citizens Bank Opera House
                <span class="external-icon" aria-hidden="true">&#8599;</span>
            </a>
            <a href="https://ci.ovationtix.com/34432" target="_blank" rel="noopener">
                OvationTix Shows
                <span class="external-icon" aria-hidden="true">&#8599;</span>
            </a>
        </div>
    </section>

    <footer class="status-bar">
        <div class="status-content">
            <span class="status-summary" id="status-summary">Loading status...</span>
            <button class="status-expand" id="status-expand" aria-expanded="false">
                Details
            </button>
        </div>
        <div class="status-details" id="status-details" hidden>
            <table>
                <thead>
                    <tr>
                        <th>Theater</th>
                        <th>Status</th>
                        <th>Shows</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="status-table-body">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/cardView.js"></script>
    <script src="js/calendarView.js"></script>
    <script src="js/status.js"></script>
</body>
</html>
